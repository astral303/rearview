# Pins the rustup proxies in .cargo\bin for a cargo run outside mise, where
# RUSTUP_TOOLCHAIN is unset and the proxies would fall through to rustup's
# default. The version and components must equal rust in mise.lock; the
# check-toolchain-pin task in mise.toml fails when they differ.
[toolchain]
channel = "1.97.0"
components = ["clippy", "rustfmt", "rust-src"]
