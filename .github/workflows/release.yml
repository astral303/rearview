name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.2.0. Empty builds the selected branch.
        required: false
      publish:
        description: Attach the archives to a GitHub release
        type: boolean
        default: false

# Only the release job writes. The check and build jobs run third-party actions
# over three platforms and need to read the repository and nothing else.
permissions:
  contents: read

env:
  BIN_NAME: rearview
  # ONNX Runtime release bundled with the Linux build. It must be the version
  # the pinned ort-sys crate targets. Cargo.lock only shows the crate version;
  # the runtime version is the `ms@...` in that crate's
  # build/download/dist.txt. See the ort pin in Cargo.toml.
  ORT_VERSION: 1.24.2

jobs:
  # Restores the test gate that `c859863` removed with the Nix flake. The `nix`
  # job ran `nix build`, whose check phase runs the suite, and the build job
  # carried `needs: nix`.
  #
  # It runs the checks directly rather than a package build. The old gate could
  # be broken by drift between nixpkgs' onnxruntime and the version `ort`
  # accepts, which would have held up tarballs for people who install no other
  # way.
  #
  # ci.yml cannot stand in for it: that runs on pushes to main and on pull
  # requests, so a tag cut from a release branch has no run to require, and
  # requiring one by commit would refuse every release candidate.
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/rust-toolchain
      - run: just check-ci
      # The Linux archive is built with this feature and the default build
      # compiles its code out, so `just check-ci` above does not reach it.
      - run: mise run test-dynamic-ort

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            ort: static
            exe: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            ort: dynamic
            exe: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
            ort: static
            exe: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      # Only rust: a release build runs none of the other tools in mise.toml.
      #
      # Naming a tool skips the lockfile detection mise-action does when it is
      # given no arguments, so the version comes from `locked = true` in
      # mise.toml instead. Without that setting this re-resolved `latest`, and
      # release binaries were built with whatever that meant on the day.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Linux loads ONNX Runtime at run time from the bundled lib/; macOS and
      # Windows link it statically during the build.
      - name: Download ONNX Runtime
        if: matrix.ort == 'dynamic'
        run: |
          case "${{ matrix.platform }}" in
            darwin-arm64) ort_platform="osx-arm64" ;;
            linux-amd64) ort_platform="linux-x64" ;;
            *) echo "Unsupported platform: ${{ matrix.platform }}" >&2; exit 1 ;;
          esac
          curl -L -o onnxruntime.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-${ort_platform}-${ORT_VERSION}.tgz"
          mkdir onnxruntime
          tar -xzf onnxruntime.tgz -C onnxruntime --strip-components=1
      - name: Build
        run: |
          build_args=(--release --locked --target ${{ matrix.target }})
          if [ "${{ matrix.ort }}" == "dynamic" ]; then
            build_args+=(--features release-dynamic-ort)
          fi
          cargo build "${build_args[@]}"
      # Release binaries are stripped by the [profile.release] setting in
      # Cargo.toml. The Windows archive is also published as a zip for manual
      # downloads; the updater fetches the tar.gz on every platform.
      - name: Package
        run: |
          # Hash with whichever tool the platform has. macOS ships shasum and
          # not sha256sum; the Windows runner's Git Bash has sha256sum on PATH
          # and keeps shasum in core_perl, which is not on it; Linux has both.
          # sha256sum writes `*` before the filename, which no reader of these
          # files sees: they all take the first whitespace-separated field.
          sha256_into() {
            if command -v shasum > /dev/null; then
              shasum -a 256 "$1" > "$2"
            else
              sha256sum "$1" > "$2"
            fi
          }
          package="package"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe }}" "$package/"
          if [ "${{ matrix.ort }}" == "dynamic" ]; then
            mkdir -p "$package/lib"
            find onnxruntime/lib -maxdepth 1 \( -type f -o -type l \) -name 'libonnxruntime*' -exec cp -P {} "$package/lib/" \;
          fi
          archive="${BIN_NAME}-${{ matrix.platform }}"
          tar -C "$package" -czf "$archive.tar.gz" .
          sha256_into "$archive.tar.gz" "$archive.sha256"
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a "$archive.zip" "./$package/*" > /dev/null
            sha256_into "$archive.zip" "$archive.zip.sha256"
          fi
      - name: Smoke test packaged binary
        run: |
          "./package/${BIN_NAME}${{ matrix.exe }}" --version
          if [ "${{ matrix.ort }}" == "dynamic" ]; then
            test -f package/lib/libonnxruntime.dylib || test -f package/lib/libonnxruntime.so
            test -f "package/lib/libonnxruntime.${ORT_VERSION}.dylib" || test -f "package/lib/libonnxruntime.so.${ORT_VERSION}"
          fi
      # The step above never loads ONNX Runtime; --version does not reach it.
      # verify-release-binary seeds a throwaway history so the embedder is, and
      # fails if the packaged binary cannot embed. A binary that cannot open the
      # runtime blocks rather than failing, hence the step timeout.
      - name: Cache the embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/rearview-release-check/cache
          key: bge-small-en-v1.5-${{ runner.os }}
      - name: Check semantic search in the packaged binary
        timeout-minutes: 15
        run: |
          export REARVIEW_BIN="./package/${BIN_NAME}${{ matrix.exe }}"
          export REARVIEW_SANDBOX="$HOME/.cache/rearview-release-check"
          mise run verify-release-binary
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.sha256
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.zip
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.zip.sha256

  # A tag push always publishes. A manual run only does when asked, so the
  # workflow can build and check a branch without creating a release.
  release:
    needs: build
    if: github.event_name == 'push' || (inputs.publish && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The tag being released, whether it arrived as a push or an input.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          merge-multiple: true
      # Pin the generated notes to the last release that was not a pre-release.
      # GitHub otherwise compares against whichever release came last, so a
      # `-rc` tag would absorb the changes and leave the release after it nearly
      # empty. The last stable is the right base for both: an rc should list
      # what it contains, and the release after it should list all of it again.
      - name: Find the last stable release
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases" \
            --jq 'map(select(.prerelease == false and .draft == false))
                  | .[0].tag_name // ""')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Comparing against ${tag:-nothing: GitHub will choose}"
      # Create the release as a draft, attach the archives, then publish it.
      # This repository has immutable releases turned on, and a published
      # release accepts no further assets. Creating it published and uploading
      # afterwards is what the action does by default, and it produced
      # v0.3.0-rc1 with zero assets and no way to repair it:
      #
      #   Cannot upload asset rearview-darwin-arm64.sha256 to an immutable
      #   release. GitHub only allows asset uploads before a release is
      #   published.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        id: draft
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          # Publish a hyphenated tag as a pre-release, which keeps it out of
          # /releases/latest. That endpoint is what `rearview update` and
          # Scoop's `checkver: github` both read to decide what to offer.
          prerelease: ${{ contains(env.TAG, '-') }}
          previous_tag: ${{ steps.baseline.outputs.tag }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            *.sha256
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH \
            "repos/${{ github.repository }}/releases/${{ steps.draft.outputs.id }}" \
            -F draft=false > /dev/null
          gh release view "$TAG" \
            --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets|length)"'
