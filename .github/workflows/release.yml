name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  BIN_NAME: rearview
  # ONNX Runtime release bundled with the macOS and Linux builds. It must be
  # the version the pinned ort-sys crate targets. Cargo.lock only shows the
  # crate version; the runtime version is the `ms@...` in that crate's
  # build/download/dist.txt. See the ort pin in Cargo.toml.
  ORT_VERSION: 1.24.2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            ort: dynamic
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            ort: dynamic
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
            ort: static
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      # Installs the Rust version pinned in mise.lock; nothing else from
      # mise.toml is needed in CI.
      - uses: jdx/mise-action@v4
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # macOS and Linux load ONNX Runtime at run time from the bundled lib/;
      # Windows links it statically during the build.
      - name: Download ONNX Runtime
        if: matrix.ort == 'dynamic'
        run: |
          case "${{ matrix.platform }}" in
            darwin-arm64) ort_platform="osx-arm64" ;;
            linux-amd64) ort_platform="linux-x64" ;;
            *) echo "Unsupported platform: ${{ matrix.platform }}" >&2; exit 1 ;;
          esac
          curl -L -o onnxruntime.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-${ort_platform}-${ORT_VERSION}.tgz"
          mkdir onnxruntime
          tar -xzf onnxruntime.tgz -C onnxruntime --strip-components=1
      - name: Build
        run: |
          build_args=(--release --locked --target ${{ matrix.target }})
          if [ "${{ matrix.ort }}" == "dynamic" ]; then
            build_args+=(--features release-dynamic-ort)
          fi
          cargo build "${build_args[@]}"
      # Release binaries are stripped by the [profile.release] setting in
      # Cargo.toml. The Windows archive is also published as a zip for manual
      # downloads; the updater fetches the tar.gz on every platform.
      - name: Package
        run: |
          exe=""
          if [ "${{ runner.os }}" == "Windows" ]; then exe=".exe"; fi
          package="package"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${exe}" "$package/"
          if [ "${{ matrix.ort }}" == "dynamic" ]; then
            mkdir -p "$package/lib"
            find onnxruntime/lib -maxdepth 1 \( -type f -o -type l \) -name 'libonnxruntime*' -exec cp -P {} "$package/lib/" \;
          fi
          archive="${BIN_NAME}-${{ matrix.platform }}"
          tar -C "$package" -czf "$archive.tar.gz" .
          shasum -a 256 "$archive.tar.gz" > "$archive.sha256"
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a "$archive.zip" "./$package/*" > /dev/null
            shasum -a 256 "$archive.zip" > "$archive.zip.sha256"
          fi
      - name: Smoke test packaged binary
        run: |
          exe=""
          if [ "${{ runner.os }}" == "Windows" ]; then exe=".exe"; fi
          "./package/${BIN_NAME}${exe}" --version
          if [ "${{ matrix.ort }}" == "dynamic" ]; then
            test -f package/lib/libonnxruntime.dylib || test -f package/lib/libonnxruntime.so
            test -f "package/lib/libonnxruntime.${ORT_VERSION}.dylib" || test -f "package/lib/libonnxruntime.so.${ORT_VERSION}"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.sha256
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.zip
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            *.sha256
