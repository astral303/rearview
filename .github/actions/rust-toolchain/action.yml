name: Rust toolchain
description: >
  Install the toolchain pinned in mise.lock, caching the rustup half alongside
  mise's record of it, and restore the cargo registry and target directory.

runs:
  using: composite
  steps:
    # One cache entry covering both halves of a mise-installed toolchain.
    # mise records what it installed under its own directory, but a
    # rustup-backed toolchain lives in ~/.rustup. Restore one without the other
    # and mise treats rust as installed and skips it, so the `profile` in
    # mise.toml never reaches rustup, which then materialises the toolchain on
    # demand under the runner's own `minimal` profile: no rustfmt or clippy for
    # checkle's first two checks to call.
    #
    # That is jdx/mise-action#215, open since 2025. Fixes were closed unmerged
    # in both repositories, and mise's maintainer has raised dropping the Rust
    # backend, so this is the standing arrangement rather than a stopgap. If
    # that backend does go, the replacement is rust-toolchain.toml and the
    # runner's own rustup.
    #
    # One entry rather than two: separate entries are evicted independently,
    # and a hit on mise's half with a miss on rustup's is the bug again.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # `1.*` is the toolchain mise installed; the runner image's own
        # `stable-*` sits beside it and is present before any of this runs.
        # Skipping it leaves the entry the same size, because the two are a
        # patch apart and compress against each other, but it halves the files
        # a restore unpacks: 9-10s down to 4s.
        #
        # ~/.cargo belongs to Swatinem/rust-cache below. settings.toml is left
        # out on purpose: the runner image supplies it, and it holds the
        # `minimal` profile this works around.
        path: |
          ~/.local/share/mise
          ~/.rustup/toolchains/1.*
        key: mise-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
    # No install_args: naming tools re-resolves them and ignores mise.lock. A
    # plain install takes the locked versions. mise's own cache stays off so the
    # entry above is the only one, and cannot half-restore.
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        cache: false
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
