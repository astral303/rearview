[package]
name = "rearview"
version = "0.6.1"
edition = "2024"
description = "Browse and search Claude Code, Codex, OpenCode, Kimi Code, Grok Build, Pi and Oh My Pi (OMP) conversation history from the terminal, semantically or lexically."
readme = "README.md"
license = "MIT"
repository = "https://github.com/astral303/rearview"
homepage = "https://github.com/astral303/rearview"
keywords = ["claude-code", "codex", "opencode", "history", "tui"]
categories = ["command-line-utilities"]

[package.metadata.release]
allow-branch = ["main"]
pre-release-commit-message = "release v{{version}}"
tag-name = "v{{version}}"
tag-message = "release v{{version}}"
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "(?m)^## Unreleased$", replace = "## v{{version}} ({{date}})", exactly = 1 },
]

[profile.release]
strip = true

# cargo test builds unicode-ident with debug info for the syn dev-dependency,
# and the proc macros' syn copy shares it. With debug info here too, cargo
# build reuses those proc macros instead of building its own copies of them and
# of every crate that uses one.
[profile.dev.package.unicode-ident]
debug = true

[features]
release-dynamic-ort = ["dep:ort", "fastembed/ort-load-dynamic"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
blake3 = "1.8"
sha2 = "0.10"
colored = "3.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
thiserror = "2.0"
toml = "0.9"
home = "0.5"
rayon = "1.10"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["osc52"] }
textwrap = "0.16"
pulldown-cmark = "0.13"
unicode-width = "0.2"
arboard = "3.4"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
terminal-light = "1.0"
tempfile = "3"
indicatif = "0.17"
regex = "1"
unescaper = "0.2"
# ort-sys 2.0.0-rc.12 targets ONNX Runtime 1.24.2: the default build downloads
# that release, and ORT_VERSION in .github/workflows/release.yml must match it.
fastembed = { version = "5.13", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic"], optional = true }
# fastembed 5.13's version. fastembed's `hf-hub-rustls-tls` feature already
# turns on hf-hub's `rustls-tls`. rearview downloads the model itself because
# fastembed lets HF_HOME override the folder it is given.
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
# Already built for ratatui; tests enumerate `Source` with its derive.
# Keep strum's `default` feature off: it would give `cargo test` a second
# build of ratatui and rearview.
strum = { version = "0.27", default-features = false, features = ["derive"] }
# provider/capability_table.rs parses the `SessionProvider` trait with it to
# generate the capability table in PROVIDERS.md. Tests build syn apart from the
# proc-macros' copy, so the default features are off to keep that build small.
syn = { version = "2.0", default-features = false, features = ["full", "parsing"] }

[target.'cfg(unix)'.dev-dependencies]
# The Unix API crate, not the package manager: tests/show_id_stdout.rs opens a
# pseudo-terminal with it to run the conversation list on.
nix = { version = "0.29", features = ["process", "term"] }
